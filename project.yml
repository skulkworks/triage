name: Triage
options:
  bundleIdPrefix: dev.skulkworks
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "27.0"
  generateEmptyDirectories: true
  groupSortPosition: top

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.8.1

configs:
  Debug: debug
  Release: release

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: M5N5FDK55S
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

schemes:
  Triage:
    build:
      targets:
        Triage: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TriageTests
    profile:
      config: Release
    archive:
      config: Release

targets:
  Triage:
    type: application
    platform: macOS
    sources:
      - path: Triage
        excludes:
          - Resources/Info.plist
    dependencies:
      - package: Sparkle
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # Sparkle's feed and public key; Xcode merges the generated keys into it.
        INFOPLIST_FILE: Triage/Resources/Info.plist
        INFOPLIST_KEY_LSUIElement: YES
        PRODUCT_MODULE_NAME: Triage
        INFOPLIST_KEY_CFBundleDisplayName: Triage
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 SkulkWorks"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Triage/Resources/Triage.entitlements
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.skulkworks.triage.debug
          PRODUCT_NAME: Triage Dev
          INFOPLIST_KEY_CFBundleDisplayName: Triage Dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: dev.skulkworks.triage
          PRODUCT_NAME: Triage

  TriageTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Triage
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Triage Dev.app/Contents/MacOS/Triage Dev"
